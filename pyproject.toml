[project]
name = "apila-sports"
version = "0.1.0"
description = "Backtest-first sports prediction & betting-edge validation platform"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
ingest = ["nba_api>=1.4"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apila*"]
